name: aluminum_production
description: A new Flutter project for aluminum extrusion production management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  firebase_database: ^11.2.4
  # firebase_storage: ^12.3.4
  
  provider: ^6.1.2
  fluttertoast: ^8.2.12
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  excel: ^2.0.0
  # flutter_pdfview: ^1.3.2
  
  http: ^1.3.0
  path: ^1.9.1
  mime: ^1.0.6
  
  # ✅ استخدم الإصدار الأحدث المتوافق مع intl ^0.20.2
  syncfusion_flutter_pdfviewer: ^28.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # ✅ إضافة مجلد الصور
  assets:
    - assets/images/