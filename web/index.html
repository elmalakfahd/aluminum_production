<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام إدارة الإنتاج المتكامل - DELMAR PRO">

  <!-- ✅ إعدادات PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976D2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DELMAR PRO">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <script>
    // ============================================================
    // ✅ PWA - دعم تثبيت التطبيق
    // ============================================================

    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.deferredPrompt = deferredPrompt;
      console.log('✅ PWA ready for install');
      document.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });

    window.addEventListener('appinstalled', () => {
      console.log('✅ App installed successfully!');
      window.deferredPrompt = null;
      document.dispatchEvent(new CustomEvent('pwa-installed'));
    });

    window.addEventListener('load', () => {
      const isStandalone = window.navigator.standalone ||
                          window.matchMedia('(display-mode: standalone)').matches;

      if (isStandalone) {
        console.log('✅ App is running in standalone mode (installed)');
        document.dispatchEvent(new CustomEvent('pwa-installed'));
      }
    });

    console.log('✅ PWA setup complete!');
  </script>

  <title>🏆 DELMAR PRO</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
